<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="The Ward">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint (per-phone preference).
    try { document.documentElement.dataset.theme = localStorage.getItem('ward_theme') || 'light'; }
    catch { document.documentElement.dataset.theme = 'light'; }
  </script>
  <title>The Ward</title>
</head>
<body>
  <div id="app"><div class="empty">Loading…</div></div>
  <div id="toast"></div>
  <script src="vendor/sql-wasm.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Reload once when an updated version takes over, so changes show without reopening twice.
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) location.reload(); });
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
